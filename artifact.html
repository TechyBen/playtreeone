<title>treeps1</title>
<style>
  /* Full-bleed canvas game view; a deliberate single dark look so the fog scene reads the same on any host theme. */
  :root {
    --ground: #0d0e14;
    --ink: #ecebf3;
    --glass: rgba(18, 18, 26, .5);
    --glass-on: rgba(255, 255, 255, .16);
    --shadow: #000;
    --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 12px/1.4 var(--font-ui); }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none;
    image-rendering: pixelated; image-rendering: crisp-edges; }
  #presets { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; display: flex; flex-wrap: wrap; gap: 2px;
    padding: 4px; max-width: calc(100vw - 300px); border-radius: 999px; background: var(--glass); backdrop-filter: blur(6px); }
  #presets button { border: 0; background: none; color: inherit; font: inherit; padding: 6px 12px;
    border-radius: 999px; cursor: pointer; opacity: .75; }
  #presets button:hover, #presets button:focus-visible { opacity: 1; outline: 1px solid var(--glass-on); }
  #presets button.on { background: var(--glass-on); opacity: 1; font-weight: 600; }
  #hud { position: fixed; left: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); opacity: .75; white-space: pre;
    font: 11px/1.5 var(--font-mono); text-shadow: 0 1px 2px var(--shadow); pointer-events: none; }
  #help { position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); opacity: .6; font-size: 11px;
    text-shadow: 0 1px 2px var(--shadow); pointer-events: none; }
  #atlas { position: fixed; left: 12px; top: 60px; display: none; max-height: calc(100vh - 120px); overflow: auto;
    padding: 8px 10px; border-radius: 8px; background: var(--glass); font-size: 11px; }
  #atlas canvas { display: block; margin: 3px 0 10px; image-rendering: pixelated; }
  @media (max-width: 700px) {
    #presets { max-width: calc(100vw - 24px); top: auto; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
    #help, #hud { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js"
  }
}
</script>
<canvas id="view"></canvas>
<div id="presets"></div>
<div id="atlas"></div>
<div id="hud"></div>
<div id="help">drag: look around · right-drag: pan · wheel: zoom · WASD: walk (shift = run)</div>
<script type="module" src="src/main.js"></script>
