<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wildflower review sheet</title>
<!-- Every chosen species' flower tiles with its name, from sheet.json
     (python tools/flowers/traits_auto.py --sheet). Serve the repo root:
     python -m http.server 8173, then open /tools/flowers/sheet.html.
     Fix odd ones in tools/flowers/traits.json. -->
<style>
  body { margin: 16px; background: #26302a; color: #e4e8e2; font: 12px/1.3 system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .f { background: #33403a; border-radius: 6px; padding: 6px 8px; }
  .f.manual { outline: 1px solid #c8b45a; }
  canvas { image-rendering: pixelated; width: 100%; display: block; margin-bottom: 4px; }
  b { font-weight: 600; } i { color: #a8b4ab; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 2px; }
  .meta { color: #a8b4ab; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
import { makeFlowerAtlas } from '../../src/leafgen.js';
const rows = await (await fetch('sheet.json')).json();
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const grid = document.getElementById('grid');
rows.forEach((r, i) => {
  const img = makeFlowerAtlas(r.shape, { tile: 32, seed: 7 + i });
  const cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const ctx = cv.getContext('2d'), out = ctx.createImageData(img.width, img.height);
  const P = hex(r.petal), C = hex(r.centre), G = [74, 122, 58];
  for (let p = 0; p < img.data.length; p += 4) {
    if (img.data[p + 3] < 128) continue;
    const t = img.data[p] / 255, g = img.data[p + 1];
    const base = g > 191 ? G : g > 64 ? C : P;
    const k = 0.5 + 0.62 * Math.round(Math.min(1, t * 0.75 + 0.3) * 3) / 3;
    for (let c = 0; c < 3; c++) out.data[p + c] = Math.min(255, base[c] * k);
    out.data[p + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
  const d = document.createElement('div');
  d.className = 'f' + (r.manual ? ' manual' : '');
  d.innerHTML = `<b>${i + 1}. ${r.common || r.name}</b><br><i>${r.name}</i><br>
    <span class="meta"><span class="sw" style="background:${r.petal}"></span><span class="sw" style="background:${r.centre}"></span>
    ${r.shape} · ${r.height} m · ${r.family}</span>`;
  d.prepend(cv);
  grid.append(d);
});
</script>
</body>
</html>
